<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>MandelFlight - Fractal Demo</title>

    <!-- Editor CSS -->
    <link id="editorCSS" rel="stylesheet" href="/src/projekte/fractal-demo/fractal.css">
</head>

<body>

    <!-- MOD OVERLAY -->
    <div id="modOverlay" class="hidden">
        <div id="modUIContainer"></div>
        <button id="modClose">Close</button>
    </div>

    <!-- FRACTAL CANVAS -->
    <canvas id="fractalCanvas" width="1920" height="1080"></canvas>

    <!-- EDITOR OVERLAY -->
    <div id="cmOverlay" class="hidden">

        <canvas id="cmCanvas"></canvas>
        <canvas id="curveCanvas"></canvas>

        <div id="cmKnobs"></div>
    </div>
    <div id="presetPopup" class="hidden">
        <div id="presetPopupInner">
            <h2 id="presetPopupTitle"></h2>

            <div id="presetSaveUI" class="hidden">
                <input id="presetNameInput" placeholder="Preset-Name">
                <button id="presetSaveBtn" class="button">Speichern</button>
            </div>

            <div id="presetLoadUI" class="hidden">
                <ul id="presetList"></ul>
            </div>

            <button id="presetCloseBtn" class="button">Close</button>
        </div>
    </div>
    <div id="alertPopup" class="hidden">
        <div id="alertPopupInner">
            <div id="alertMsg"></div>
            <button id="alertBtn">Ok</button>
        </div>
    </div>
    <div id="yesNoDialog" class="hidden">
        <div id="yesNoInner">
            <div id="yesNoMessage"></div>
            <div class="yesno-buttons">
                <button class="button" id="yesBtn">Yes</button>
                <button class="button" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/projekte/fractal-demo/main.js"></script>
</body>

</html>
