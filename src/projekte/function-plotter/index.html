<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MandelFlight - Function Plotter</title>
    <link rel="stylesheet" href="/src/projekte/function-plotter/plotter.css">
</head>

<body>
    <div id="app">
        <canvas id="plot" width="600" height="600"></canvas>

        <div id="controls">
            <div id="stages"></div>
            <button id="addStage" class="add">+ Stufe</button>
            <label><input type="checkbox" id="showSteps" checked> Zwischenschritte zeigen</label>
            <div id="presetBar">
                <input id="presetName" placeholder="Preset-Name">
                <button id="presetSave">Speichern</button>
            </div>
            <ul id="presetList"></ul>
            <div id="readout"></div>
            <div id="hint">Kette: x &rarr; Stufe 1 &rarr; Stufe 2 &hellip; Rot = Ergebnis. Knob: ziehen / Mausrad, Doppelklick = Reset. Zwischen den Stufen wird auf 0..1 geklemmt.</div>
        </div>
    </div>

    <script type="module" src="/src/projekte/function-plotter/plotter.js"></script>
</body>

</html>
