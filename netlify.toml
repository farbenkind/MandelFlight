[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# /projekte/<name> -> gebaute Seite (spiegelt die Rewrite-Regel in vite.config.js)
[[redirects]]
  from = "/projekte/:name"
  to = "/src/projekte/:name/index.html"
  status = 200

[[redirects]]
  from = "/projekte/:name/"
  to = "/src/projekte/:name/index.html"
  status = 200